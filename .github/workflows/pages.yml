name: Publish Elhem Creative Editions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate transparent logo PNGs
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python scripts/generate_transparent_logos.py
          test "$(find assets/logo-showroom/transparent -name '*.png' | wc -l)" -eq 27
      - name: Upload static portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
