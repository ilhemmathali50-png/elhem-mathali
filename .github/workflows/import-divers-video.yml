name: Import Divers Video
on:
  push:
    paths:
      - '.github/workflows/import-divers-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied video
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1ffe1572-3ea5-4bcf-815f-61d3073278c2.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjFjNjU0MzI1Y2MyODkxMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDg3MDgzNH0.ewVzwt8YbsiMIjH3LJW1gqmn7zfBR1hz56e5CvKh-A8'
        run: |
          set -euo pipefail
          mkdir -p assets/divers
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --output assets/divers/formation-acupuncture.mp4 "$SOURCE_URL"
          test "$(stat -c%s assets/divers/formation-acupuncture.mp4)" -gt 30000000
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -ss 5 -i assets/divers/formation-acupuncture.mp4 -frames:v 1 -q:v 4 -y assets/divers/formation-acupuncture-poster.jpg
          fi
      - name: Commit portfolio video
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/divers/formation-acupuncture.mp4
          if test -e assets/divers/formation-acupuncture-poster.jpg; then git add assets/divers/formation-acupuncture-poster.jpg; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: add supplied acupuncture course showcase video"
          git push
