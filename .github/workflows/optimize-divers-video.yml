name: Optimize Divers Video
on:
  push:
    paths:
      - '.github/workflows/optimize-divers-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mobile video and preview
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets/divers
          ffmpeg -hide_banner -loglevel error -y -i assets/divers/formation-acupuncture.mp4 -vf "scale=360:-2" -c:v libx264 -preset medium -crf 29 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 72k assets/divers/formation-acupuncture-web.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i assets/divers/formation-acupuncture.mp4 -vf "scale=320:-2" -frames:v 1 -q:v 3 assets/divers/formation-acupuncture-poster.jpg
          test "$(stat -c%s assets/divers/formation-acupuncture-web.mp4)" -gt 100000
          test -s assets/divers/formation-acupuncture-poster.jpg
      - name: Publish media assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/divers/formation-acupuncture-web.mp4 assets/divers/formation-acupuncture-poster.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: optimize acupuncture video for mobile and add thumbnail"
          git push
